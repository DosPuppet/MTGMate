# Site nginx de Planecircle (voir docs/deploiement.md).
# À copier dans /etc/nginx/sites-available/planecircle, en remplaçant mtg.mondomaine.fr,
# puis : ln -s ../sites-available/planecircle /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Le HTTPS est ajouté ensuite par : certbot --nginx -d mtg.mondomaine.fr

# En-tête Connection pour les WebSockets (si ce « map » existe déjà ailleurs sous ce nom, supprimez celui-ci).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache des images de Scryfall relayées par /scry/ (joueurs dont le réseau bloque Scryfall) : chaque image
# n'est demandée qu'une fois à Scryfall. 2 Go couvrent tout le pool ; une image inutilisée 60 jours est oubliée.
proxy_cache_path /var/cache/nginx/planecircle-scry levels=1:2 keys_zone=planecircle_scry:10m max_size=2g inactive=60d use_temp_path=off;

# Les en-têtes de sécurité des pages (nosniff, X-Frame-Options…) viennent du serveur Node. Une fois le HTTPS ajouté
# par certbot, dans le bloc « listen 443 » :
#     add_header Strict-Transport-Security "max-age=31536000" always;

server {
    listen 80;
    listen [::]:80;
    server_name mtg.mondomaine.fr;

    # Jeu en ligne : WebSocket. Délai long : une partie peut rester calme plusieurs minutes
    # (le serveur envoie de toute façon un ping toutes les 25 s).
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Adresse réelle du joueur (plafonds par adresse du serveur) : X-Forwarded-For peut être rempli par le client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Images de Scryfall relayées par l'appli (liste blanche dans server/src/index.ts), mises en cache par nginx.
    location /scry/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache planecircle_scry;
        # Une image par chemin : une variante de la chaîne de requête (?x=1, ?x=2…) ne remplit pas le cache.
        proxy_cache_key $scheme$host$uri;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
    }

    # Interface (fichiers du client construit) et /healthz.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
