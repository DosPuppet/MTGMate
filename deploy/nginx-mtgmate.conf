# Site nginx de MTG Mate (voir docs/deploiement.md).
# À copier dans /etc/nginx/sites-available/mtgmate, en remplaçant mtg.mondomaine.fr,
# puis : ln -s ../sites-available/mtgmate /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Le HTTPS est ajouté ensuite par : certbot --nginx -d mtg.mondomaine.fr

# En-tête Connection pour les WebSockets (si ce « map » existe déjà ailleurs sous ce nom, supprimez celui-ci).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mtg.mondomaine.fr;

    # Jeu en ligne : WebSocket. Délai long : une partie peut rester calme plusieurs minutes
    # (le serveur envoie de toute façon un ping toutes les 25 s).
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Interface (fichiers du client construit) et /healthz.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
