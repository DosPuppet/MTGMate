# Standard legalities compared with Scryfall, every week (PLAN-C, C19): a ban announcement, a rotation or a new set
# makes the job fail. Fix: reimport (npm run import-cards), override (packages/cards/data/legality-overrides.json),
# README list (test cards/test/legality.test.ts).
# Commander (PLAN-E): bans, Game Changers and non-legal cards, compared with packages/cards/data/commander.json
# (fix: npx tsx tools/check-legality.ts --commander --write).
name: Standard legalities

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  legality:
    name: Standard legalities (Scryfall)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx tools/check-legality.ts
      - run: npx tsx tools/check-legality.ts --commander
        if: always()
