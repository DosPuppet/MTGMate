# Légalités Standard comparées à Scryfall, chaque semaine (PLAN-C, C19) : une annonce de bannissement, une rotation ou
# une nouvelle extension fait échouer la tâche. Corriger : réimport (npm run import-cards), dérogation
# (packages/cards/data/legality-overrides.json), liste du README (test cards/test/legality.test.ts).
name: Légalités Standard

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  legality:
    name: Légalités Standard (Scryfall)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx tools/check-legality.ts
