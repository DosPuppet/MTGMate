# Continuous integration: short verification on every push and pull request, full verification every night.
# The interface tests (Playwright + Vite) and the bench stay local: npm run verify -- --full.
name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event_name == 'schedule' && 'Full verification' || 'Verification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm run verify
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run verify -- --full --no-ui --no-bench
          else
            npm run verify -- --ci
          fi
      # Every night, the pool of one set, in rotation (one per day), with the strict fuzz (offered options accepted).
      - name: Fuzz of one set (rotation)
        if: github.event_name == 'schedule'
        run: |
          SETS=(FDN FRA EOE DFT OTJ BIG FIN DSK BLB LCI TDM ECL WOE SOS MKM TLA MSH SPM TMT HOB)
          SET=${SETS[$(( $(date +%j | sed 's/^0*//') % ${#SETS[@]} ))]}
          echo "Set of the day: $SET"
          npm run fuzz -- --games 300 --pool "$SET" --offers 3 --seed "$(date +%j | sed 's/^0*//')" --jobs 4
          npm run fuzz -- --games 100 --pool "$SET" --players 3 --offers 3 --jobs 4
      - name: Verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: test-results/verify/
